<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA PRO</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; text-align: center; margin: 0; overflow-x: hidden; }
        .container { background: #151515; padding: 20px; border-radius: 15px; width: 90%; max-width: 450px; display: inline-block; margin-top: 20px; border: 1px solid #333; }
        .hidden { display: none !important; }
        .log-box { background: #000; color: #f1c40f; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; font-weight: bold; }
        button { width: 100%; padding: 15px; margin: 5px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-blue { background: #3498db; color: white; }
        .timer { font-size: 40px; color: #e74c3c; font-weight: bold; }
        #game-over-screen { position: fixed; top:0; left:0; width: 100%; height:100%; background: rgba(0,0,0,0.95); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .role-tag { font-size: 0.8rem; color: #888; margin-right: 10px; }
    </style>
</head>
<body>

    <div id="game-over-screen" class="hidden">
        <h1 id="winner-text" style="font-size: 3rem; color: #f1c40f;">--</h1>
        <div id="final-list" style="margin: 20px;"></div>
        <button class="btn-blue" style="width: 200px;" onclick="location.reload()">لعبة جديدة</button>
    </div>

    <div id="screen-login" class="container">
        <h1>🕵️‍♂️ مافيا</h1>
        <input type="text" id="username" placeholder="اسمك المستعار" style="width: 80%; padding: 10px; margin-bottom: 10px;">
        <button class="btn-red" onclick="showSetup()">إنشاء مجموعة</button>
        <button class="btn-blue" onclick="showJoin()">دخول بكود</button>
    </div>

    <div id="screen-setup" class="container hidden">
        <h3>إعدادات الروم</h3>
        المافيا: <input type="number" id="mC" value="1" style="width:50px"> | 
        دكتور: <input type="number" id="dC" value="1" style="width:50px"><br>
        شايب: <input type="number" id="sC" value="1" style="width:50px"> | 
        وقت الدور: <input type="number" id="tC" value="15" style="width:50px"><br>
        وقت النهار: <input type="number" id="dayC" value="30" style="width:50px"><br>
        <button class="btn-red" onclick="createRoom()">تأكيد الإنشاء</button>
    </div>

    <div id="screen-lobby" class="container hidden">
        <h2 id="room-code" style="color: #f1c40f;">--</h2>
        <div id="player-list"></div>
        <button id="start-btn" class="btn-red hidden" onclick="startGame()">ابدأ اللعبة 🔥</button>
    </div>

    <div id="screen-game" class="container">
        <div id="timer" class="timer">--</div>
        <div id="ui-phase" style="color: #3498db; font-size: 1.2rem; margin-bottom: 10px;">انتظر المضيف..</div>
        <div id="ui-log" class="log-box">مرحباً بك في مافيا</div>
        <div id="role-display" style="font-size: 1.5rem; color: #e74c3c; margin: 10px 0;"></div>
        <div id="action-list"></div>
    </div>

    <audio id="bell" src="https://www.soundjay.com/misc/sounds/bell-ringing-01.mp3"></audio>

    <script>
        const socket = io();
        let currentRoom = "", myRole = "", timeLeft = 0, timerInt;

        function showScreen(id) {
            document.querySelectorAll('.container').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function showSetup() { if(document.getElementById('username').value) showScreen('screen-setup'); }
        function showJoin() { if(document.getElementById('username').value) { showScreen('screen-login'); document.getElementById('screen-login').innerHTML += '<input type="text" id="rCode" placeholder="الكود"><button class="btn-blue" onclick="joinRoom()">دخول</button>'; } }

        function createRoom() {
            socket.emit('createRoom', {
                name: document.getElementById('username').value,
                mafia: document.getElementById('mC').value, doctor: document.getElementById('dC').value,
                detective: document.getElementById('sC').value, timer: document.getElementById('tC').value,
                dayTimer: document.getElementById('dayC').value, defTimer: 10
            });
        }

        function joinRoom() {
            currentRoom = document.getElementById('rCode').value;
            socket.emit('joinRoom', { name: document.getElementById('username').value, code: currentRoom });
        }

        socket.on('roomCreated', c => { currentRoom = c; document.getElementById('room-code').innerText = "كود: " + c; showScreen('screen-lobby'); });
        
        socket.on('updatePlayers', ps => {
            document.getElementById('player-list').innerHTML = ps.map(p => `<div>👤 ${p.name}</div>`).join('');
            if(ps.length >= 2) document.getElementById('start-btn').classList.remove('hidden');
        });

        function startGame() { socket.emit('startGame', currentRoom); }

        socket.on('yourRole', r => { myRole = r; document.getElementById('role-display').innerText = "دورك: " + r; });

        socket.on('changePhase', d => {
            document.getElementById('ui-phase').innerText = d.phase;
            startTimer(d.timer);
            const list = document.getElementById('action-list');
            list.innerHTML = "";

            // شرط "قائد المافيا": الزر يظهر فقط إذا كنت مافيا وأنت "القائد" المختار من السيرفر
            const isMafiaLeader = (d.phase.includes("المافيا") && myRole === "مافيا" && socket.id === d.mafiaLeaderId);
            const isOtherRole = (d.phase.includes("الشايب") && myRole === "شايب") || (d.phase.includes("الدكتور") && myRole === "دكتور");

            if(isMafiaLeader || isOtherRole) {
                d.players.forEach(p => {
                    if(p.id !== socket.id) {
                        let b = document.createElement('button'); b.className = "btn-red"; b.innerText = p.name;
                        b.onclick = () => socket.emit(myRole === "مافيا" ? "mafiaAction" : (myRole === "دكتور" ? "doctorAction" : "detectiveAction"), { roomCode: currentRoom, targetId: p.id });
                        list.appendChild(b);
                    }
                });
            } else if (d.phase.includes("المافيا") && myRole === "مافيا") {
                list.innerHTML = "<p>أنت مافيا، لكن خويك هو اللي يختار القتيل.. تشاوروا!</p>";
            } else {
                list.innerHTML = "ليل.. غمض عيونك 💤";
            }
        });

        socket.on('dayStarted', d => {
            document.getElementById('ui-log').innerText = d.msg;
            document.getElementById('ui-phase').innerText = "النهار - وقت التصويت";
            startTimer(d.dayTimer);
            const list = document.getElementById('action-list');
            list.innerHTML = "";
            d.players.forEach(p => {
                let b = document.createElement('button'); b.className = "btn-blue"; b.innerText = p.name;
                b.onclick = () => { socket.emit('castVote', { roomCode: currentRoom, targetId: p.id }); list.innerHTML = "تم التصويت"; }
                list.appendChild(b);
            });
        });

        socket.on('gameOver', d => {
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('winner-text').innerText = "الفائز: " + d.winner;
            document.getElementById('final-list').innerHTML = d.players.map(p => `<div>${p.name}: <b style="color:#f1c40f">${p.role}</b></div>`).join('');
        });

        function startTimer(s) {
            clearInterval(timerInt);
            timeLeft = s;
            timerInt = setInterval(() => {
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft <= 0) clearInterval(timerInt);
                timeLeft--;
            }, 1000);
        }

        socket.on('playBell', () => { document.getElementById('bell').play(); });
        socket.on('uiLog', m => { document.getElementById('ui-log').innerText = m; });
    </script>
</body>
</html>
