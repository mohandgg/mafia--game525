<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA - FIX</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; }
        .container { background: #222; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; display: inline-block; margin-top: 20px; }
        .hidden { display: none; }
        button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-blue { background: #3498db; color: white; }
        .log { background: #000; padding: 10px; border-radius: 5px; color: #f1c40f; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="screen-login" class="container">
        <h1>🕵️‍♂️ MAFIA</h1>
        <input type="text" id="username" placeholder="اكتب اسمك" style="width:80%; padding:10px; margin-bottom:10px;">
        <button class="btn-red" onclick="showSetup()">إنشاء مجموعة</button>
        <button class="btn-blue" onclick="showJoin()">دخول بكود</button>
    </div>

    <div id="screen-setup" class="container hidden">
        <h3>الإعدادات</h3>
        المافيا: <input type="number" id="mC" value="1" style="width:40px"><br>
        الوقت: <input type="number" id="tC" value="20" style="width:40px"><br>
        <button class="btn-red" onclick="createRoom()">إنشاء ونشر الكود</button>
    </div>

    <div id="screen-join" class="container hidden">
        <input type="text" id="joinCode" placeholder="أدخل الكود هنا" style="width:80%; padding:10px;">
        <button class="btn-blue" onclick="joinRoom()">انضمام</button>
    </div>

    <div id="screen-lobby" class="container hidden">
        <h2 id="display-code" style="color:#f1c40f"></h2>
        <div id="player-list" style="margin-bottom:20px;"></div>
        <button id="start-btn" class="btn-red hidden" onclick="startGame()">ابدأ القيم 🔥</button>
    </div>

    <div id="screen-game" class="container hidden">
        <div id="ui-phase" style="font-weight:bold; color:#3498db"></div>
        <div id="ui-log" class="log">بانتظار البداية...</div>
        <div id="role-display" style="font-size:1.5rem; color:#e74c3c; margin:10px;"></div>
        <div id="action-list"></div>
    </div>

    <audio id="bell" src="https://www.soundjay.com/misc/sounds/bell-ringing-01.mp3"></audio>

    <script>
        const socket = io();
        let currentRoom = "", myRole = "";

        function showScreen(id) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function showSetup() { if(document.getElementById('username').value) showScreen('screen-setup'); }
        function showJoin() { if(document.getElementById('username').value) showScreen('screen-join'); }

        function createRoom() {
            socket.emit('createRoom', {
                name: document.getElementById('username').value,
                mafia: document.getElementById('mC').value,
                doctor: 1, detective: 1, timer: document.getElementById('tC').value, dayTimer: 30
            });
        }

        function joinRoom() {
            let code = document.getElementById('joinCode').value;
            socket.emit('joinRoom', { name: document.getElementById('username').value, code: code });
        }

        // حل مشكلة: اللاعب اللي يدخل يشوف إنه دخل
        socket.on('joinedSuccessfully', (code) => {
            currentRoom = code;
            document.getElementById('display-code').innerText = "كود: " + code;
            showScreen('screen-lobby');
        });

        socket.on('roomCreated', (code) => {
            currentRoom = code;
            document.getElementById('display-code').innerText = "كود: " + code;
            showScreen('screen-lobby');
            document.getElementById('start-btn').classList.remove('hidden'); // يظهر فقط للمضيف
        });

        socket.on('updatePlayers', (players) => {
            document.getElementById('player-list').innerHTML = players.map(p => `<div>👤 ${p.name}</div>`).join('');
        });

        function startGame() {
            socket.emit('startGame', currentRoom);
        }

        socket.on('yourRole', (role) => {
            myRole = role;
            document.getElementById('role-display').innerText = "دورك: " + role;
            showScreen('screen-game');
        });

        socket.on('changePhase', (d) => {
            document.getElementById('ui-phase').innerText = d.phase;
            const list = document.getElementById('action-list');
            list.innerHTML = "";
            
            // نظام قائد المافيا
            const isMyTurn = (d.phase.includes("مافيا") && myRole === "مافيا" && socket.id === d.mafiaLeaderId) ||
                             (d.phase.includes("شايب") && myRole === "شايب") ||
                             (d.phase.includes("دكتور") && myRole === "دكتور");

            if(isMyTurn) {
                d.players.forEach(p => {
                    if(p.id !== socket.id) {
                        let b = document.createElement('button'); b.className = "btn-red"; b.innerText = p.name;
                        b.onclick = () => socket.emit(myRole === "مافيا" ? "mafiaAction" : (myRole === "دكتور" ? "doctorAction" : "detectiveAction"), { roomCode: currentRoom, targetId: p.id });
                        list.appendChild(b);
                    }
                });
            } else {
                list.innerHTML = "<p>ليل.. انتظر دورك 💤</p>";
            }
        });

        socket.on('uiLog', m => document.getElementById('ui-log').innerText = m);
        socket.on('playBell', () => document.getElementById('bell').play());
        socket.on('gameOver', m => alert(m));
    </script>
</body>
</html>
