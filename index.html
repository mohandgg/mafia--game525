<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA FIX</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; text-align: center; margin: 0; padding: 10px; }
        .screen { background: #111; padding: 25px; border-radius: 15px; border: 1px solid #333; max-width: 400px; margin: 20px auto; display: none; }
        .active { display: block; }
        .log-box { background: #1a1a1a; color: #f1c40f; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #c0392b; }
        button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-red { background: #c0392b; color: #fff; }
        .btn-blue { background: #2980b9; color: #fff; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; background: #222; color: #fff; border: 1px solid #444; text-align: center; }
        .timer { font-size: 3rem; color: #e74c3c; font-weight: bold; }
        #game-over { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="game-over">
        <h1 id="win-text" style="color: #f1c40f;">--</h1>
        <div id="final-roles" style="margin-bottom: 20px;"></div>
        <button class="btn-blue" style="width: 200px;" onclick="location.reload()">لعبة جديدة</button>
    </div>

    <div id="screen-login" class="screen active">
        <h1>🕵️‍♂️ مافيا</h1>
        <input type="text" id="username" placeholder="اكتب اسمك المستعار">
        <button class="btn-red" onclick="showSetup()">إنشاء مجموعة</button>
        <button class="btn-blue" onclick="showJoinInput()">ادخل بكود</button>
    </div>

    <div id="screen-join" class="screen">
        <h3>أدخل كود الغرفة</h3>
        <input type="text" id="joinCodeInput" placeholder="00000">
        <button class="btn-blue" onclick="joinRoom()">دخول</button>
        <button style="background:none; color:#888" onclick="showScreen('screen-login')">رجوع</button>
    </div>

    <div id="screen-setup" class="screen">
        <h3>إعدادات اللعبة</h3>
        المافيا: <input type="number" id="mC" value="1"><br>
        الدكتور: <input type="number" id="dC" value="1"><br>
        الشايب: <input type="number" id="sC" value="1"><br>
        وقت الليل: <input type="number" id="tC" value="20"><br>
        وقت النهار: <input type="number" id="dayC" value="30"><br>
        وقت التبرير: <input type="number" id="defC" value="15">
        <button class="btn-red" onclick="createRoom()">تأكيد الإنشاء</button>
    </div>

    <div id="screen-lobby" class="screen">
        <h2 id="room-display" style="color:#f1c40f">--</h2>
        <div id="player-list" style="margin: 20px 0; text-align: right;"></div>
        <button id="start-btn" class="btn-red" style="display:none;" onclick="startGame()">ابدأ اللعبة 🔥</button>
    </div>

    <div id="screen-game" class="screen">
        <div id="timer" class="timer">--</div>
        <div id="ui-phase" style="color:#3498db; font-weight:bold;">--</div>
        <div id="ui-log" class="log-box">بانتظار المضيف...</div>
        <div id="role-display" style="font-size:1.5rem; color:#e74c3c; margin:15px 0;">--</div>
        <div id="action-list"></div>
    </div>

    <audio id="bell" src="https://www.soundjay.com/misc/sounds/bell-ringing-01.mp3"></audio>

    <script>
        const socket = io();
        let currentRoom = "", myRole = "", timerInt;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showSetup() { if(document.getElementById('username').value) showScreen('screen-setup'); }
        function showJoinInput() { if(document.getElementById('username').value) showScreen('screen-join'); }

        function createRoom() {
            socket.emit('createRoom', {
                name: document.getElementById('username').value,
                mafia: document.getElementById('mC').value,
                doctor: document.getElementById('dC').value,
                detective: document.getElementById('sC').value,
                timer: document.getElementById('tC').value,
                dayTimer: document.getElementById('dayC').value,
                defTimer: document.getElementById('defC').value
            });
        }

        function joinRoom() {
            let code = document.getElementById('joinCodeInput').value;
            socket.emit('joinRoom', { name: document.getElementById('username').value, code: code });
        }

        socket.on('roomCreated', code => {
            currentRoom = code;
            document.getElementById('room-display').innerText = "كود الغرفة: " + code;
            document.getElementById('start-btn').style.display = "block";
            showScreen('screen-lobby');
        });

        socket.on('joinedSuccessfully', d => {
            currentRoom = d.code;
            document.getElementById('room-display').innerText = "كود الغرفة: " + d.code;
            showScreen('screen-lobby');
        });

        socket.on('updatePlayers', ps => {
            document.getElementById('player-list').innerHTML = ps.map(p => `<div>👤 ${p.name}</div>`).join('');
        });

        function startGame() { socket.emit('startGame', currentRoom); }

        socket.on('yourRole', r => {
            myRole = r;
            document.getElementById('role-display').innerText = "دورك: " + r;
            showScreen('screen-game');
        });

        socket.on('changePhase', d => {
            document.getElementById('ui-phase').innerText = d.phase;
            startCountdown(d.timer);
            const list = document.getElementById('action-list');
            list.innerHTML = "";
            
            const isTurn = (d.phase.includes("مافيا") && myRole === "مافيا" && socket.id === d.mafiaLeaderId) ||
                           (d.phase.includes("شايب") && myRole === "شايب") ||
                           (d.phase.includes("دكتور") && myRole === "دكتور");

            if(isTurn) {
                d.players.forEach(p => {
                    if(p.id !== socket.id) {
                        let b = document.createElement('button'); b.className = "btn-red"; b.innerText = p.name;
                        b.onclick = () => { socket.emit(myRole === "مافيا" ? "mafiaAction" : (myRole === "دكتور" ? "doctorAction" : "detectiveAction"), { roomCode: currentRoom, targetId: p.id }); list.innerHTML = "تم!"; }
                        list.appendChild(b);
                    }
                });
            } else { list.innerHTML = "ليل.. انتظر دورك 💤"; }
        });

        socket.on('dayStarted', d => {
            document.getElementById('ui-log').innerText = d.msg;
            document.getElementById('ui-phase').innerText = "النهار - التصويت";
            startCountdown(d.dayTimer);
            const list = document.getElementById('action-list');
            list.innerHTML = "";
            d.players.forEach(p => {
                let b = document.createElement('button'); b.className = "btn-blue"; b.innerText = p.name;
                b.onclick = () => { socket.emit('castVote', { roomCode: currentRoom, targetId: p.id }); list.innerHTML = "تم التصويت"; }
                list.appendChild(b);
            });
        });

        socket.on('defensePhase', d => {
            document.getElementById('ui-log').innerText = `المتهم: ${d.name}. دافع عن نفسك!`;
            startCountdown(d.time);
            const list = document.getElementById('action-list');
            list.innerHTML = "";
            ['طرد 💀', 'عفو ✅'].forEach(opt => {
                let b = document.createElement('button'); b.innerText = opt;
                b.onclick = () => { socket.emit('finalDecision', { roomCode: currentRoom, targetId: d.targetId, decision: opt.includes('طرد')?'kill':'spare' }); list.innerHTML = "تم!"; }
                list.appendChild(b);
            });
        });

        socket.on('gameOver', d => {
            document.getElementById('game-over').style.display = "flex";
            document.getElementById('win-text').innerText = "الفائز: " + d.winner;
            document.getElementById('final-roles').innerHTML = d.players.map(p => `<div>${p.name}: ${p.role}</div>`).join('');
        });

        function startCountdown(s) {
            clearInterval(timerInt);
            let t = s;
            timerInt = setInterval(() => {
                document.getElementById('timer').innerText = t;
                if(t <= 0) clearInterval(timerInt);
                t--;
            }, 1000);
        }

        socket.on('playBell', () => document.getElementById('bell').play());
        socket.on('uiLog', m => document.getElementById('ui-log').innerText = m);
    </script>
</body>
</html>
