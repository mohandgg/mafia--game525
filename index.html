<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA - النسخة الأصلية</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --red: #c0392b; --black: #121212; --gold: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--black); color: white; text-align: center; margin:0; }
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; display: inline-block; width: 90%; max-width: 400px; margin-top: 20px; }
        input { width: 85%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; background: #222; color: white; text-align: center; }
        button { width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main { background: var(--red); color: white; }
        .btn-blue { background: #2980b9; color: white; }
        .btn-green { background: #27ae60; color: white; }
        .timer { font-size: 40px; color: var(--red); font-weight: bold; margin: 10px; }
        .player-item { background: #222; padding: 10px; margin: 5px; border-radius: 8px; border-right: 4px solid var(--gold); }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active">
        <div class="card">
            <h1>🕵️‍♂️ MAFIA</h1>
            <input type="text" id="username" placeholder="اسمك المستعار">
            <button class="btn-main" onclick="showSection('screen-setup')">إنشاء غرفة</button>
            <button class="btn-blue" onclick="showSection('screen-join')">دخول بكود</button>
        </div>
    </div>

    <div id="screen-setup" class="screen">
        <div class="card">
            <h3>الإعدادات</h3>
            المافيا: <input type="number" id="mCount" value="1"><br>
            الدكتور: <input type="number" id="dCount" value="1"><br>
            الشايب: <input type="number" id="sCount" value="1"><br>
            ثواني الدور: <input type="number" id="secTime" value="20"><br>
            <button class="btn-main" onclick="createRoom()">إنشاء ونشر الكود</button>
            <button style="background:none; color:gray;" onclick="showSection('screen-login')">رجوع</button>
        </div>
    </div>

    <div id="screen-join" class="screen">
        <div class="card">
            <h3>ادخل كود الدعوة</h3>
            <input type="text" id="roomInput" placeholder="أدخل الكود هنا">
            <button class="btn-blue" onclick="joinRoom()">انضمام الآن</button>
            <button style="background:none; color:gray;" onclick="showSection('screen-login')">رجوع</button>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <div class="card">
            <h2 id="display-code" style="color:var(--gold)">--</h2>
            <div id="player-list"></div>
            <button id="start-btn" class="btn-green" style="display:none;" onclick="startGame()">ابدأ اللعبة 🔥</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div id="timer-box" class="timer">--</div>
        <div class="card">
            <p>دورك السري هو:</p>
            <h2 id="my-role" style="color:var(--gold)">--</h2>
            <hr>
            <h3 id="phase-name"></h3>
            <div id="action-list"></div>
        </div>
    </div>

    <audio id="snd-kill" src="https://www.soundjay.com/mechanical/gun-gunshot-01.mp3"></audio>
    <audio id="snd-write" src="https://www.soundjay.com/misc/sounds/scribble-1.mp3"></audio>
    <audio id="snd-heal" src="https://www.soundjay.com/misc/sounds/tape-1.mp3"></audio>

    <script>
        const socket = io();
        let currentRoom = "", myRole = "", timeLeft = 0, timerInterval;

        function showSection(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function unlockAudio() {
            ['snd-kill','snd-write','snd-heal'].forEach(id => {
                let a = document.getElementById(id);
                a.play().then(() => a.pause());
            });
        }

        function createRoom() {
            const name = document.getElementById('username').value;
            if(!name) return alert("سجل اسمك");
            unlockAudio();
            socket.emit('createRoom', {
                name,
                mafia: document.getElementById('mCount').value,
                doctor: document.getElementById('dCount').value,
                detective: document.getElementById('sCount').value,
                timer: document.getElementById('secTime').value
            });
        }

        function joinRoom() {
            const name = document.getElementById('username').value;
            const code = document.getElementById('roomInput').value;
            if(!name || !code) return alert("اكمل البيانات");
            unlockAudio();
            socket.emit('joinRoom', { name, code });
            currentRoom = code;
        }

        socket.on('roomCreated', c => {
            currentRoom = c;
            document.getElementById('display-code').innerText = "كود الغرفة: " + c;
            showSection('screen-lobby');
        });

        socket.on('updatePlayers', ps => {
            showSection('screen-lobby');
            document.getElementById('player-list').innerHTML = ps.map(p => `<div class="player-item">👤 ${p.name}</div>`).join('');
            if(ps.length >= 2) document.getElementById('start-btn').style.display = "block";
        });

        function startGame() { socket.emit('startGame', currentRoom); }

        socket.on('yourRole', r => {
            myRole = r;
            document.getElementById('my-role').innerText = r;
            showSection('screen-game');
        });

        socket.on('changePhase', d => {
            clearInterval(timerInterval);
            document.getElementById('phase-name').innerText = d.phase;
            timeLeft = d.timer;
            startCountdown();

            const list = document.getElementById('action-list');
            list.innerHTML = "";
            const isTurn = (d.phase.includes("المافيا") && myRole === "مافيا") || (d.phase.includes("الشايب") && myRole === "شايب") || (d.phase.includes("الدكتور") && myRole === "دكتور");

            if(isTurn) {
                d.players.forEach(p => {
                    if(p.id !== socket.id) {
                        let b = document.createElement('button');
                        b.className = "btn-main"; b.innerText = p.name;
                        b.onclick = () => {
                            let ev = myRole === "مافيا" ? "mafiaAction" : (myRole === "دكتور" ? "doctorAction" : "detectiveAction");
                            socket.emit(ev, { roomCode: currentRoom, targetId: p.id });
                            list.innerHTML = "تم الاختيار ✅";
                        };
                        list.appendChild(b);
                    }
                });
            } else { list.innerHTML = "<p>الآن ليل.. انتظر دورك 💤</p>"; }
        });

        function startCountdown() {
            timerInterval = setInterval(() => {
                document.getElementById('timer-box').innerText = timeLeft;
                if(timeLeft <= 0) clearInterval(timerInterval);
                timeLeft--;
            }, 1000);
        }

        socket.on('dayStarted', d => {
            alert(d.killed ? "مات اللاعب: " + d.players.find(p=>p.id===d.killed).name : "لم يمت أحد الليلة!");
            document.getElementById('phase-name').innerText = "التصويت العلني 🗳️";
            const list = document.getElementById('action-list');
            list.innerHTML = "<h4>صوت للي تشك فيه:</h4>";
            d.players.filter(p => p.isAlive).forEach(p => {
                let b = document.createElement('button');
                b.className = "btn-blue"; b.innerText = p.name;
                b.onclick = () => { socket.emit('castVote', { roomCode: currentRoom, targetId: p.id }); list.innerHTML = "تم التصويت!"; };
                list.appendChild(b);
            });
        });

        socket.on('playSound', t => { document.getElementById('snd-'+t).play(); });
        socket.on('notification', m => alert(m));
    </script>
</body>
</html>
